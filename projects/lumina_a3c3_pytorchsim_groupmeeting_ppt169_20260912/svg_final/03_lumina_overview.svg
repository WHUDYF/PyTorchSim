<g id="header" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><text x="56" y="64" fill="#36D6B5" font-size="14">01 · LUMINA</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">Lumina：把模拟器知识变成下一次搜索的依据</text><text x="56" y="158" fill="#AAB8CC" font-size="18">先建立架构启发式知识 AHK，再用瓶颈反馈选择候选并修正认识。</text></g>
<g id="knowledge" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><path fill="#162235" d="M68,212 H1212 A12,12 0 0 1 1224,224 V350 A12,12 0 0 1 1212,362 H68 A12,12 0 0 1 56,350 V224 A12,12 0 0 1 68,212 Z" /><text x="82" y="252" fill="#A78BFA" font-size="24" font-weight="700">知识构建</text><text x="292" y="258" fill="#4DA3FF" font-size="26" font-weight="700">QualE</text><text x="292" y="301" fill="#F4F7FB" font-size="18">读取源码 → 参数与指标的影响关系</text><text x="760" y="258" fill="#A78BFA" font-size="26" font-weight="700">QuanE</text><text x="760" y="301" fill="#F4F7FB" font-size="18">局部微扰 → 方向与影响强度</text><text x="292" y="337" fill="#718096" font-size="16">关系与权重组成可更新的 AHK，而非已证明的因果模型</text></g>
