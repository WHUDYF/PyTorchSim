<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220" /><text x="56" y="64" fill="#36D6B5" font-family="Consolas, 'Courier New', monospace" font-size="14">PYTORCHSIM 5 / 7 · TOGSIM RUNTIME</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">TOGSim 每个周期同时推进计算、DMA、互连和 DRAM</text><text x="56" y="158" fill="#AAB8CC" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18">瓶颈来自系统交互：一个 tile 的计算等待，可能是 Core、DMA、NoC 或内存服务造成的。</text><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><path fill="#162235" d="M66,221 H260 A10,10 0 0 1 270,231 V503 A10,10 0 0 1 260,513 H66 A10,10 0 0 1 56,503 V231 A10,10 0 0 1 66,221 Z" /><text x="80" y="270" fill="#A78BFA" font-size="22" font-weight="700">Scheduler</text><text x="80" y="327" fill="#F4F7FB" font-size="18">peek / issue tile</text><text x="80" y="369" fill="#AAB8CC" font-size="17">按 core 与 slot</text><text x="80" y="426" fill="#F4F7FB" font-size="18">finish / 依赖</text><path fill="#162235" d="M312,221 H506 A10,10 0 0 1 516,231 V503 A10,10 0 0 1 506,513 H312 A10,10 0 0 1 302,503 V231 A10,10 0 0 1 312,221 Z" /><text x="326" y="270" fill="#36D6B5" font-size="22" font-weight="700">Core</text><text x="326" y="327" fill="#F4F7FB" font-size="18">vector / systolic</text><text x="326" y="369" fill="#F4F7FB" font-size="18">pipeline / bubble</text><text x="326" y="426" fill="#AAB8CC" font-size="17">COMP 完成时间</text><path fill="#162235" d="M558,221 H752 A10,10 0 0 1 762,231 V503 A10,10 0 0 1 752,513 H558 A10,10 0 0 1 548,503 V231 A10,10 0 0 1 558,221 Z" /><text x="572" y="270" fill="#4DA3FF" font-size="22" font-weight="700">DMA + NoC</text><text x="572" y="327" fill="#F4F7FB" font-size="18">tile → requests</text><text x="572" y="369" fill="#F4F7FB" font-size="18">注入端口 / 延迟</text><text x="572" y="426" fill="#AAB8CC" font-size="17">MOVIN / MOVOUT</text><path fill="#162235" stroke="#FFB454" d="M804,221 H1214 A10,10 0 0 1 1224,231 V503 A10,10 0 0 1 1214,513 H804 A10,10 0 0 1 794,503 V231 A10,10 0 0 1 804,221 Z" /><text x="818" y="270" fill="#FFB454" font-size="22" font-weight="700">DRAM / Cache</text><text x="818" y="327" fill="#F4F7FB" font-size="18">SimpleDRAM 或 Ramulator2</text><text x="818" y="369" fill="#F4F7FB" font-size="18">通道、频率、请求大小</text><text x="818" y="426" fill="#AAB8CC" font-size="17">完成请求 → Core / Scheduler</text><path d="M275 365 H294 M521 365 H540 M767 365 H786" stroke="#4DA3FF" stroke-width="2" /><polygon points="298,365 287,359 287,371" fill="#4DA3FF" /><polygon points="544,365 533,359 533,371" fill="#4DA3FF" /><polygon points="790,365 779,359 779,371" fill="#4DA3FF" /><text x="56" y="583" fill="#F4F7FB" font-size="20">Simulator::cycle() → core_cycle → icnt_cycle → dram_cycle；最终输出 cycles、利用率、流量、stall。</text></g><text x="56" y="683" fill="#718096" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="12">代码：TOGSim/src/Simulator.cc、Core.cc、DMA.cc、Scheduler.cc、Dram.cc、Interconnect.cc。</text><text x="1160" y="683" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">19 / 24</text></svg>