<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220" /><text x="56" y="64" fill="#36D6B5" font-family="Consolas, 'Courier New', monospace" font-size="14">PYTORCHSIM 4 / 7 · TOG</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">TOG 不是抽象模型图，而是可展开的 tile 程序</text><text x="56" y="158" fill="#AAB8CC" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18">ONNX 只是容器；节点属性携带循环、地址、tile size、计算类型与 cycle。</text><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><path fill="#162235" stroke="#4DA3FF" d="M68,230 H284 A12,12 0 0 1 296,242 V445 A12,12 0 0 1 284,457 H68 A12,12 0 0 1 56,445 V242 A12,12 0 0 1 68,230 Z" /><text x="82" y="275" fill="#4DA3FF" font-size="23" font-weight="700">MOVIN</text><text x="82" y="329" fill="#F4F7FB" font-size="19">外存 → SRAM</text><text x="82" y="376" fill="#AAB8CC" font-size="17">地址 / stride / tile</text><path fill="#162235" stroke="#36D6B5" d="M360,230 H576 A12,12 0 0 1 588,242 V445 A12,12 0 0 1 576,457 H360 A12,12 0 0 1 348,445 V242 A12,12 0 0 1 360,230 Z" /><text x="374" y="275" fill="#36D6B5" font-size="23" font-weight="700">COMP</text><text x="374" y="329" fill="#F4F7FB" font-size="19">向量 / systolic</text><text x="374" y="376" fill="#AAB8CC" font-size="17">torchsim_cycle</text><path fill="#162235" stroke="#A78BFA" d="M652,230 H868 A12,12 0 0 1 880,242 V445 A12,12 0 0 1 868,457 H652 A12,12 0 0 1 640,445 V242 A12,12 0 0 1 652,230 Z" /><text x="666" y="275" fill="#A78BFA" font-size="23" font-weight="700">MOVOUT</text><text x="666" y="329" fill="#F4F7FB" font-size="19">SRAM → 外存</text><text x="666" y="376" fill="#AAB8CC" font-size="17">写回 tile 地址</text><path fill="#162235" stroke="#FFB454" d="M944,230 H1212 A12,12 0 0 1 1224,242 V445 A12,12 0 0 1 1212,457 H944 A12,12 0 0 1 932,445 V242 A12,12 0 0 1 944,230 Z" /><text x="958" y="275" fill="#FFB454" font-size="23" font-weight="700">BAR / loop</text><text x="958" y="329" fill="#F4F7FB" font-size="19">等待依赖、展开循环</text><text x="958" y="376" fill="#AAB8CC" font-size="17">inner / outer / accumulation</text><path d="M301 344 H341 M593 344 H633 M885 344 H925" stroke="#4DA3FF" stroke-width="2" /><polygon points="345,344 334,338 334,350" fill="#4DA3FF" /><polygon points="637,344 626,338 626,350" fill="#4DA3FF" /><polygon points="929,344 918,338 918,350" fill="#4DA3FF" /><path fill="#162235" d="M68,510 H1212 A12,12 0 0 1 1224,522 V588 A12,12 0 0 1 1212,600 H68 A12,12 0 0 1 56,588 V522 A12,12 0 0 1 68,510 Z" /><text x="86" y="550" fill="#F4F7FB" font-size="20">TOGSim 解析后：loop expansion → Tile → Instruction → 地址请求 / pipeline</text><text x="86" y="581" fill="#AAB8CC" font-size="17">这正是 I 的落点：tile、循环顺序、融合结果会改变系统可见的执行图。</text></g><text x="56" y="683" fill="#718096" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="12">代码：AsmParser/onnx_utility.py；TOGSim/src/TileGraphParser.cc；docs/togsim-code-reading-spec.md。</text><text x="1160" y="683" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">18 / 24</text></svg>