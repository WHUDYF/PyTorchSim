<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220" />
<g id="header" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><text x="56" y="64" fill="#A78BFA" font-size="14">HIDA 1 / 6 · 编译流程</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">HIDA 把固定算法逐步变成可综合的数据流硬件</text><text x="56" y="158" fill="#AAB8CC" font-size="18">核心是 HIDA-IR 分层表示 + HIDA-OPT 分层优化；最终通过 HLS 工具生成 RTL。</text></g>
<g id="io" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><text x="68" y="227" fill="#4DA3FF" font-size="24" font-weight="700">PyTorch → Torch-MLIR</text><text x="68" y="262" fill="#AAB8CC" font-size="18">或 C++ → Polygeist</text><path d="M393 229 H510" stroke="#4DA3FF" stroke-width="2" /><polygon points="515,229 504,223 504,235" fill="#4DA3FF" /><text x="546" y="227" fill="#F4F7FB" font-size="24">MLIR 计算 / 循环表示</text><text x="546" y="262" fill="#AAB8CC" font-size="18">复用 linalg、affine 等 dialect</text></g>
<g id="functional" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><path fill="#162235" stroke="#4DA3FF" d="M68,308 H491 A12,12 0 0 1 503,320 V505 A12,12 0 0 1 491,517 H68 A12,12 0 0 1 56,505 V320 A12,12 0 0 1 68,308 Z" /><text x="81" y="350" fill="#4DA3FF" font-size="22" font-weight="700">Functional dataflow</text><text x="81" y="400" fill="#F4F7FB" font-size="20">① 构建 dispatch / task 层级</text><text x="81" y="441" fill="#F4F7FB" font-size="20">② 按模式融合，并平衡任务工作量</text><text x="81" y="485" fill="#AAB8CC" font-size="17">决定哪些计算放在一起、保留哪些并发机会</text></g>
<g id="structural" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><path fill="#162235" stroke="#A78BFA" d="M565,308 H1212 A12,12 0 0 1 1224,320 V505 A12,12 0 0 1 1212,517 H565 A12,12 0 0 1 553,505 V320 A12,12 0 0 1 565,308 Z" /><text x="581" y="350" fill="#A78BFA" font-size="22" font-weight="700">Structural dataflow</text><text x="581" y="400" fill="#F4F7FB" font-size="20">③ 显式化 node、buffer、读写关系</text><text x="581" y="441" fill="#F4F7FB" font-size="20">④ 消除多生产者冲突，平衡不同数据路径</text><text x="581" y="482" fill="#F4F7FB" font-size="20">⑤ 分配并行度，协调循环展开与共享存储布局</text></g>
<path d="M507 414 H540" stroke="#A78BFA" stroke-width="2" /><polygon points="545,414 534,408 534,420" fill="#A78BFA" />
<g id="lowering" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><text x="68" y="585" fill="#36D6B5" font-size="24" font-weight="700">指令 / 接口优化</text><text x="332" y="585" fill="#AAB8CC" font-size="26">→</text><text x="390" y="585" fill="#F4F7FB" font-size="24">HLS C++</text><text x="612" y="585" fill="#AAB8CC" font-size="26">→</text><text x="674" y="585" fill="#F4F7FB" font-size="24">Vitis HLS</text><text x="876" y="585" fill="#AAB8CC" font-size="26">→</text><text x="940" y="585" fill="#36D6B5" font-size="24">RTL / FPGA</text><text x="68" y="631" fill="#FFB454" font-size="18">每一层先固定一部分决策，再把约束传给下一层；仍可能得到局部最优。</text></g>
<text x="56" y="683" fill="#718096" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="12">来源：HIDA §4–6、Fig.3，arXiv:2311.03379 / ASPLOS 2024。</text><text x="1160" y="683" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">09 / 24</text></svg>