<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220" />
<g id="header" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><text x="56" y="64" fill="#36D6B5" font-size="14">LUMINA · QUALITATIVE ENGINE</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">QualE：先追踪“谁影响谁”，再选择要探索的参数</text><text x="56" y="158" fill="#AAB8CC" font-size="18">LLM 阅读模拟器代码，提取架构资源与 PPA 指标之间的结构关系。</text></g>
<g id="source" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><path fill="#162235" d="M68,225 H349 A12,12 0 0 1 361,237 V524 A12,12 0 0 1 349,536 H68 A12,12 0 0 1 56,524 V237 A12,12 0 0 1 68,225 Z" /><text x="84" y="278" fill="#4DA3FF" font-size="26" font-weight="700">输入：代码与定义</text><text x="84" y="340" fill="#F4F7FB" font-size="20">参数在哪里被读取？</text><text x="84" y="387" fill="#AAB8CC" font-size="18">计算吞吐与资源公式</text><text x="84" y="429" fill="#AAB8CC" font-size="18">功耗 / 面积计算路径</text><text x="84" y="471" fill="#AAB8CC" font-size="18">访存与互连模型</text></g>
<g id="map" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><path fill="#162235" stroke="#A78BFA" d="M442,225 H815 A12,12 0 0 1 827,237 V524 A12,12 0 0 1 815,536 H442 A12,12 0 0 1 430,524 V237 A12,12 0 0 1 442,225 Z" /><text x="460" y="278" fill="#A78BFA" font-size="26" font-weight="700">Influence Map</text><text x="460" y="330" fill="#718096" font-size="16">概念示意，非原文数值表</text><text x="460" y="383" fill="#F4F7FB" font-size="20">Core 数 → 计算资源 / 面积</text><text x="460" y="427" fill="#F4F7FB" font-size="20">存储通道 → 带宽 / 功耗</text><text x="460" y="471" fill="#F4F7FB" font-size="20">互连资源 → 传输与拥塞</text></g>
<g id="constraint" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><path fill="#162235" d="M908,225 H1212 A12,12 0 0 1 1224,237 V524 A12,12 0 0 1 1212,536 H908 A12,12 0 0 1 896,524 V237 A12,12 0 0 1 908,225 Z" /><text x="925" y="278" fill="#36D6B5" font-size="26" font-weight="700">输出：搜索依据</text><text x="925" y="340" fill="#F4F7FB" font-size="20">先看与瓶颈相关的参数</text><text x="925" y="389" fill="#AAB8CC" font-size="18">同时列出资源代价</text><text x="925" y="431" fill="#AAB8CC" font-size="18">形成可被实验推翻的假设</text><text x="925" y="473" fill="#FFB454" font-size="18">代码关系 ≠ 性能因果证明</text></g>
<path d="M365 380 H416 M832 380 H882" stroke="#4DA3FF" stroke-width="2" /><polygon points="420,380 409,374 409,386" fill="#4DA3FF" /><polygon points="886,380 875,374 875,386" fill="#4DA3FF" />
<g id="takeaway" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><line x1="56" y1="585" x2="1224" y2="585" stroke="#2A3A52" /><text x="70" y="630" fill="#F4F7FB" font-size="20">迁移方向：编译参数 → MLIR / TOG 的变化 → 模拟器中的资源与延迟变化。</text></g>
<text x="56" y="683" fill="#718096" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="12">来源：LUMINA §3.2.1；底部为本研究的迁移建议。</text><text x="1160" y="683" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">04 / 24</text></svg>