<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220" /><text x="56" y="64" fill="#A78BFA" font-family="Consolas, 'Courier New', monospace" font-size="14">HIDA 5 / 6 · INTENSITY + CONNECTION AWARE</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">并行度不是每个节点都拉满：先看工作量，再服从共享布局</text><text x="56" y="158" fill="#AAB8CC" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18">IA 关注计算强度，CA 记录节点连接的 permutation / scaling map，并把它们变成 DSE 约束。</text><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><path fill="#162235" d="M66,213 H319 A10,10 0 0 1 329,223 V521 A10,10 0 0 1 319,531 H66 A10,10 0 0 1 56,521 V223 A10,10 0 0 1 66,213 Z" /><text x="80" y="258" fill="#4DA3FF" font-size="22" font-weight="700">① 分析</text><text x="80" y="309" fill="#F4F7FB" font-size="18">统计 op intensity</text><text x="80" y="348" fill="#F4F7FB" font-size="18">记录 shared-buffer</text><text x="80" y="387" fill="#AAB8CC" font-size="17">连接、置换、步长</text><text x="80" y="439" fill="#FFB454" font-size="17">强度不是完整性能模型</text><path fill="#162235" d="M372,213 H625 A10,10 0 0 1 635,223 V521 A10,10 0 0 1 625,531 H372 A10,10 0 0 1 362,521 V223 A10,10 0 0 1 372,213 Z" /><text x="386" y="258" fill="#A78BFA" font-size="22" font-weight="700">② 排序</text><text x="386" y="309" fill="#F4F7FB" font-size="18">连接数降序</text><text x="386" y="348" fill="#F4F7FB" font-size="18">强度作为 tie-breaker</text><text x="386" y="406" fill="#AAB8CC" font-size="17">先处理会影响更多</text><text x="386" y="437" fill="#AAB8CC" font-size="17">节点的决策</text><path fill="#162235" d="M678,213 H931 A10,10 0 0 1 941,223 V521 A10,10 0 0 1 931,531 H678 A10,10 0 0 1 668,521 V223 A10,10 0 0 1 678,213 Z" /><text x="692" y="258" fill="#36D6B5" font-size="22" font-weight="700">③ 生成</text><text x="692" y="309" fill="#F4F7FB" font-size="18">总并行预算</text><text x="692" y="348" fill="#F4F7FB" font-size="18">按强度分配 factor</text><text x="692" y="406" fill="#AAB8CC" font-size="17">满足资源限制</text><path fill="#162235" d="M984,213 H1214 A10,10 0 0 1 1224,223 V521 A10,10 0 0 1 1214,531 H984 A10,10 0 0 1 974,521 V223 A10,10 0 0 1 984,213 Z" /><text x="998" y="258" fill="#FFB454" font-size="22" font-weight="700">④ 局部 DSE</text><text x="998" y="309" fill="#F4F7FB" font-size="18">传递已定节点 factor</text><text x="998" y="348" fill="#F4F7FB" font-size="18">约束可整除与不冲突</text><text x="998" y="406" fill="#AAB8CC" font-size="17">QoR 估计器评估</text><path d="M329 370 H354 M635 370 H660 M941 370 H966" stroke="#4DA3FF" stroke-width="2" /><g font-family="Consolas, 'Courier New', monospace"><text x="84" y="584" fill="#F4F7FB" font-size="19">论文例：Node2 intensity=4096，Node0=512，Node1=256；max factor=32</text><text x="84" y="619" fill="#AAB8CC" font-size="17">IA+CA 的目标是较少 bank、较少资源浪费；该例说明方法，非 PyTorchSim 实测。</text></g></g><text x="56" y="683" fill="#718096" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="12">来源：HIDA §6.5、Algorithm 4、Table 5–6；数字为论文 Listing 1 示例。</text><text x="1160" y="683" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">13 / 24</text></svg>