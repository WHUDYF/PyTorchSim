<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220" /><text x="56" y="64" fill="#36D6B5" font-family="Consolas, 'Courier New', monospace" font-size="14">04 · 迁移关系</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">三种思想各解决一段问题，组合后才形成可执行的研究闭环</text><text x="56" y="158" fill="#AAB8CC" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18">HIDA 组织实现空间，Lumina 组织评估顺序，PyTorchSim 提供真实可追踪的执行反馈。</text><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><path fill="#162235" stroke="#A78BFA" d="M68,218 H404 A12,12 0 0 1 416,230 V498 A12,12 0 0 1 404,510 H68 A12,12 0 0 1 56,498 V230 A12,12 0 0 1 68,218 Z" /><text x="86" y="268" fill="#A78BFA" font-size="25" font-weight="700">HIDA 借鉴</text><text x="86" y="326" fill="#F4F7FB" font-size="20">层级表示</text><text x="86" y="367" fill="#F4F7FB" font-size="20">模式融合</text><text x="86" y="408" fill="#F4F7FB" font-size="20">连接 / 强度约束</text><text x="86" y="465" fill="#AAB8CC" font-size="17">迁移成 I 的合法性与候选生成器</text><path fill="#162235" stroke="#4DA3FF" d="M472,218 H808 A12,12 0 0 1 820,230 V498 A12,12 0 0 1 808,510 H472 A12,12 0 0 1 460,498 V230 A12,12 0 0 1 472,218 Z" /><text x="490" y="268" fill="#4DA3FF" font-size="25" font-weight="700">Lumina 借鉴</text><text x="490" y="326" fill="#F4F7FB" font-size="20">QualE：代码影响图</text><text x="490" y="367" fill="#F4F7FB" font-size="20">QuanE：局部 sensitivity</text><text x="490" y="408" fill="#F4F7FB" font-size="20">SE / TM：证据驱动搜索</text><text x="490" y="465" fill="#AAB8CC" font-size="17">迁移成 I×H 的实验调度器</text><path fill="#162235" stroke="#36D6B5" d="M876,218 H1212 A12,12 0 0 1 1224,230 V498 A12,12 0 0 1 1212,510 H876 A12,12 0 0 1 864,498 V230 A12,12 0 0 1 876,218 Z" /><text x="894" y="268" fill="#36D6B5" font-size="25" font-weight="700">PyTorchSim 提供</text><text x="894" y="326" fill="#F4F7FB" font-size="20">编译后 MLIR / TOG</text><text x="894" y="367" fill="#F4F7FB" font-size="20">Core / DMA / NoC / DRAM</text><text x="894" y="408" fill="#F4F7FB" font-size="20">功能与时序双重验证</text><text x="894" y="465" fill="#AAB8CC" font-size="17">迁移成可复现的评估证据</text></g><text x="56" y="588" fill="#FFB454" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="20">分工原则：先保证候选能编译、能运行、语义正确，再比较性能。</text><text x="56" y="683" fill="#718096" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="12">本页为研究整合框架；各项目来源见 sources/references.md。</text><text x="1160" y="683" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">22 / 24</text></svg>