<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220" /><text x="56" y="64" fill="#36D6B5" font-family="Consolas, 'Courier New', monospace" font-size="14">PYTORCHSIM 2 / 7 · FRONTEND</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">前端把普通 PyTorch 接入 NPU backend，再交给 MLIR lowering</text><text x="56" y="158" fill="#AAB8CC" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18">用户入口仍是 torch.compile；设备注册和 TorchInductor backend 把控制权交给 PyTorchSim。</text><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><path fill="#162235" d="M68,221 H264 A12,12 0 0 1 276,233 V497 A12,12 0 0 1 264,509 H68 A12,12 0 0 1 56,497 V233 A12,12 0 0 1 68,221 Z" /><text x="82" y="270" fill="#4DA3FF" font-size="23" font-weight="700">PyTorch</text><text x="82" y="329" fill="#F4F7FB" font-size="19">model / tensor</text><text x="82" y="372" fill="#F4F7FB" font-size="19">torch.compile</text><text x="82" y="430" fill="#AAB8CC" font-size="17">用户无需改写</text><path fill="#162235" stroke="#4DA3FF" d="M350,221 H606 A12,12 0 0 1 618,233 V497 A12,12 0 0 1 606,509 H350 A12,12 0 0 1 338,497 V233 A12,12 0 0 1 350,221 Z" /><text x="364" y="270" fill="#4DA3FF" font-size="23" font-weight="700">torch_openreg</text><text x="364" y="329" fill="#F4F7FB" font-size="18">privateuse1 → npu</text><text x="364" y="372" fill="#F4F7FB" font-size="18">register backend</text><text x="364" y="430" fill="#AAB8CC" font-size="17">MLIRScheduling</text><text x="364" y="463" fill="#AAB8CC" font-size="17">ExtensionWrapperCodegen</text><path fill="#162235" stroke="#A78BFA" d="M692,221 H918 A12,12 0 0 1 930,233 V497 A12,12 0 0 1 918,509 H692 A12,12 0 0 1 680,497 V233 A12,12 0 0 1 692,221 Z" /><text x="706" y="270" fill="#A78BFA" font-size="23" font-weight="700">MLIR lowering</text><text x="706" y="329" fill="#F4F7FB" font-size="18">mm / bmm / addmm</text><text x="706" y="372" fill="#F4F7FB" font-size="18">conv / reduction</text><text x="706" y="430" fill="#AAB8CC" font-size="17">模板 + tile mapping</text><path fill="#162235" stroke="#36D6B5" d="M1004,221 H1212 A12,12 0 0 1 1224,233 V497 A12,12 0 0 1 1212,509 H1004 A12,12 0 0 1 992,497 V233 A12,12 0 0 1 1004,221 Z" /><text x="1018" y="270" fill="#36D6B5" font-size="23" font-weight="700">Wrapper / TOG</text><text x="1018" y="329" fill="#F4F7FB" font-size="18">SRAM 生命周期</text><text x="1018" y="372" fill="#F4F7FB" font-size="18">属性与地址</text><text x="1018" y="430" fill="#AAB8CC" font-size="17">交给后端模拟</text><path d="M281 365 H328 M623 365 H670 M935 365 H982" stroke="#4DA3FF" stroke-width="2" /><polygon points="333,365 322,359 322,371" fill="#4DA3FF" /><polygon points="675,365 664,359 664,371" fill="#4DA3FF" /><polygon points="987,365 976,359 976,371" fill="#4DA3FF" /></g><text x="56" y="583" fill="#FFB454" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="20">可搜索入口：mapping strategy、fusion 选项、tile 形状、vector lane 和 scratchpad 预算。</text><text x="56" y="683" fill="#718096" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="12">代码：PyTorchSimDevice/torch_openreg/__init__.py；PyTorchSimFrontend/mlir/。</text><text x="1160" y="683" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">16 / 24</text></svg>