<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220" />
<g id="header" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><text x="56" y="64" fill="#36D6B5" font-size="14">05 · 拟议研究闭环</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">固定 A 之后，先生成合法的 I，再让 H 与 I 一起接受证据检验</text><text x="56" y="158" fill="#AAB8CC" font-size="18">这是一条可证伪的实现路线：任何候选都必须能编译、功能正确，并在完整 workload 上得到反馈。</text></g>
<g id="loop" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><circle cx="640" cy="393" r="155" fill="#162235" stroke="#2A3A52" stroke-width="2" /><text x="563" y="387" fill="#F4F7FB" font-size="26" font-weight="700">固定 A</text><text x="539" y="425" fill="#AAB8CC" font-size="18">网络与任务语义</text><path fill="#162235" stroke="#A78BFA" d="M88,243 H322 A12,12 0 0 1 334,255 V343 A12,12 0 0 1 322,355 H88 A12,12 0 0 1 76,343 V255 A12,12 0 0 1 88,243 Z" /><text x="104" y="287" fill="#A78BFA" font-size="22" font-weight="700">① HIDA 先验</text><text x="104" y="325" fill="#F4F7FB" font-size="17">层级 / 融合 / 连接约束</text><path fill="#162235" stroke="#4DA3FF" d="M420,235 H654 A12,12 0 0 1 666,247 V335 A12,12 0 0 1 654,347 H420 A12,12 0 0 1 408,335 V247 A12,12 0 0 1 420,235 Z" /><text x="436" y="279" fill="#4DA3FF" font-size="22" font-weight="700">② 生成 I</text><text x="436" y="317" fill="#F4F7FB" font-size="17">tile / layout / schedule</text><path fill="#162235" stroke="#FFB454" d="M864,243 H1184 A12,12 0 0 1 1196,255 V343 A12,12 0 0 1 1184,355 H864 A12,12 0 0 1 852,343 V255 A12,12 0 0 1 864,243 Z" /><text x="880" y="287" fill="#FFB454" font-size="22" font-weight="700">③ 枚举 H × I</text><text x="880" y="325" fill="#F4F7FB" font-size="17">资源约束 + Lumina 优先级</text><path fill="#162235" stroke="#36D6B5" d="M864,465 H1184 A12,12 0 0 1 1196,477 V565 A12,12 0 0 1 1184,577 H864 A12,12 0 0 1 852,565 V477 A12,12 0 0 1 864,465 Z" /><text x="880" y="509" fill="#36D6B5" font-size="22" font-weight="700">④ PyTorchSim</text><text x="880" y="547" fill="#F4F7FB" font-size="17">功能 / timing / stall 反馈</text><path fill="#162235" stroke="#A78BFA" d="M420,473 H654 A12,12 0 0 1 666,485 V573 A12,12 0 0 1 654,585 H420 A12,12 0 0 1 408,573 V485 A12,12 0 0 1 420,473 Z" /><text x="436" y="517" fill="#A78BFA" font-size="22" font-weight="700">⑤ 更新先验</text><text x="436" y="555" fill="#F4F7FB" font-size="17">记录失败与迁移性</text><path d="M336 299 H400 M672 299 H840 M1024 363 V457 M840 521 H672 M400 529 H290 V360" fill="none" stroke="#4DA3FF" stroke-width="2" /><polygon points="404,299 393,293 393,305" fill="#4DA3FF" /><polygon points="844,299 833,293 833,305" fill="#4DA3FF" /><polygon points="1024,461 1018,450 1030,450" fill="#4DA3FF" /><polygon points="668,529 679,523 679,535" fill="#4DA3FF" /><polygon points="286,360 280,349 292,349" fill="#4DA3FF" /></g>
<text x="56" y="638" fill="#FFB454" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="20">首个验证问题：同一固定算法下，加入 I 后，单位仿真预算能否找到更好的 H×I？</text><text x="56" y="683" fill="#718096" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="12">本页为拟议方法，不是已完成实验。</text><text x="1160" y="683" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">23 / 24</text></svg>