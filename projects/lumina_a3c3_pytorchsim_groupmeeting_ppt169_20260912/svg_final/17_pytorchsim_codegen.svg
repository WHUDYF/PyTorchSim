<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220" /><text x="56" y="64" fill="#36D6B5" font-family="Consolas, 'Courier New', monospace" font-size="14">PYTORCHSIM 3 / 7 · CODE CACHE</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">MLIRCodeCache 同时生成验证二进制、延迟样本和 TOG</text><text x="56" y="158" fill="#AAB8CC" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18">缓存和文件锁避免重复编译；时序模式打开后才继续 cycle 与 TOG 生成。</text><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><path fill="#162235" d="M66,220 H304 A10,10 0 0 1 314,230 V500 A10,10 0 0 1 304,510 H66 A10,10 0 0 1 56,500 V230 A10,10 0 0 1 66,220 Z" /><text x="82" y="268" fill="#4DA3FF" font-size="22" font-weight="700">1  输入 MLIR</text><text x="82" y="325" fill="#F4F7FB" font-size="18">写入 code cache</text><text x="82" y="367" fill="#AAB8CC" font-size="17">读取 YAML knobs</text><text x="82" y="424" fill="#F4F7FB" font-size="18">mapping / tile / vlen</text><text x="82" y="467" fill="#AAB8CC" font-size="17">检查 SRAM 使用量</text><path fill="#162235" d="M362,220 H600 A10,10 0 0 1 610,230 V500 A10,10 0 0 1 600,510 H362 A10,10 0 0 1 352,500 V230 A10,10 0 0 1 362,220 Z" /><text x="378" y="268" fill="#A78BFA" font-size="22" font-weight="700">2  编译验证</text><text x="378" y="325" fill="#F4F7FB" font-size="18">mlir-opt</text><text x="378" y="367" fill="#F4F7FB" font-size="18">translate → llc</text><text x="378" y="424" fill="#AAB8CC" font-size="17">functional_mode</text><text x="378" y="467" fill="#AAB8CC" font-size="17">输出可执行 kernel</text><path fill="#162235" d="M658,220 H896 A10,10 0 0 1 906,230 V500 A10,10 0 0 1 896,510 H658 A10,10 0 0 1 648,500 V230 A10,10 0 0 1 658,220 Z" /><text x="674" y="268" fill="#FFB454" font-size="22" font-weight="700">3  计算延迟</text><text x="674" y="325" fill="#F4F7FB" font-size="18">Gem5 sample</text><text x="674" y="367" fill="#F4F7FB" font-size="18">cycle simulator</text><text x="674" y="424" fill="#AAB8CC" font-size="17">cycle_list</text><text x="674" y="467" fill="#AAB8CC" font-size="17">写回 tile metadata</text><path fill="#162235" stroke="#36D6B5" d="M954,220 H1214 A10,10 0 0 1 1224,230 V500 A10,10 0 0 1 1214,510 H954 A10,10 0 0 1 944,500 V230 A10,10 0 0 1 954,220 Z" /><text x="970" y="268" fill="#36D6B5" font-size="22" font-weight="700">4  生成 / 运行 TOG</text><text x="970" y="325" fill="#F4F7FB" font-size="18">raw TOG → ONNX TOG</text><text x="970" y="367" fill="#F4F7FB" font-size="18">写 kernel attributes</text><text x="970" y="424" fill="#AAB8CC" font-size="17">Standalone / launch</text><text x="970" y="467" fill="#AAB8CC" font-size="17">返回 timing result</text><path d="M316 365 H344 M612 365 H640 M908 365 H936" stroke="#4DA3FF" stroke-width="2" /><polygon points="348,365 337,359 337,371" fill="#4DA3FF" /><polygon points="644,365 633,359 633,371" fill="#4DA3FF" /><polygon points="940,365 929,359 929,371" fill="#4DA3FF" /></g><text x="56" y="585" fill="#FFB454" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="20">搜索代价分层：编译 / Gem5 / Spike / TOGSim 各有不同成本，不能只统计最后一个数字。</text><text x="56" y="683" fill="#718096" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="12">代码：PyTorchSimFrontend/extension_codecache.py；AsmParser/tog_generator.py。</text><text x="1160" y="683" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">17 / 24</text></svg>