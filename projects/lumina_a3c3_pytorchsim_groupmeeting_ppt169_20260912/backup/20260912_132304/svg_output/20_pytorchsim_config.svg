<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220"/><text x="56" y="64" fill="#36D6B5" font-family="Consolas, 'Courier New', monospace" font-size="14">PYTORCHSIM 6 / 7 · CONFIGURATION</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">同一个 YAML 配置，可能同时改变编译器与模拟器行为</text><text x="56" y="158" fill="#AAB8CC" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18">做 DSE 前必须给每个 knob 标注消费者、是否需要重编译、如何验证。</text><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><rect x="56" y="213" width="354" height="322" rx="12" fill="#162235" stroke="#4DA3FF"/><text x="84" y="258" fill="#4DA3FF" font-size="23" font-weight="700">编译端 knobs</text><text x="84" y="315" fill="#F4F7FB" font-size="19">vpu_num_lanes / vector_length</text><text x="84" y="358" fill="#F4F7FB" font-size="19">mapping_strategy</text><text x="84" y="401" fill="#F4F7FB" font-size="19">tile / fusion / optimization</text><text x="84" y="464" fill="#AAB8CC" font-size="17">影响 MLIR、二进制、TOG</text><text x="84" y="497" fill="#FFB454" font-size="17">通常需要重新编译</text><rect x="463" y="213" width="354" height="322" rx="12" fill="#162235" stroke="#36D6B5"/><text x="491" y="258" fill="#36D6B5" font-size="23" font-weight="700">系统端 knobs</text><text x="491" y="315" fill="#F4F7FB" font-size="19">num_cores / systolic array</text><text x="491" y="358" fill="#F4F7FB" font-size="19">scratchpad / cache</text><text x="491" y="401" fill="#F4F7FB" font-size="19">NoC / DRAM channels / freq</text><text x="491" y="464" fill="#AAB8CC" font-size="17">影响 Core、DMA、NoC、DRAM</text><text x="491" y="497" fill="#FFB454" font-size="17">需重新运行 TOGSim</text><rect x="870" y="213" width="354" height="322" rx="12" fill="#162235" stroke="#A78BFA"/><text x="898" y="258" fill="#A78BFA" font-size="23" font-weight="700">记录与验证</text><text x="898" y="315" fill="#F4F7FB" font-size="19">配置哈希 + compiler hash</text><text x="898" y="358" fill="#F4F7FB" font-size="19">TOG / attribute / result</text><text x="898" y="401" fill="#F4F7FB" font-size="19">功能正确性 / timing 指标</text><text x="898" y="464" fill="#AAB8CC" font-size="17">避免结果无法复现</text><text x="898" y="497" fill="#FFB454" font-size="17">定义失败原因分类</text><path d="M416 370 H453 M823 370 H860" stroke="#4DA3FF" stroke-width="2"/><polygon points="457,370 446,364 446,376" fill="#4DA3FF"/><polygon points="864,370 853,364 853,376" fill="#4DA3FF"/></g><text x="56" y="589" fill="#F4F7FB" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="20">代码入口：extension_config.py 从 TOGSIM_CONFIG 读取两边共用的字段。</text><text x="56" y="683" fill="#718096" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="12">代码：PyTorchSimFrontend/extension_config.py；configs/*.yml；研究建议为本报告设计。</text><text x="1160" y="683" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">20 / 24</text></svg>
