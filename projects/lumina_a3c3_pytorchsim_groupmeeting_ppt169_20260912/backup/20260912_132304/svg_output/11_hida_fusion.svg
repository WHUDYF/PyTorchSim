<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220"/><text x="56" y="64" fill="#A78BFA" font-family="Consolas, 'Courier New', monospace" font-size="14">HIDA 3 / 6 · FUNCTIONAL OPT</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">任务融合的目标是减少通信，同时避免产生新的关键任务</text><text x="56" y="158" fill="#AAB8CC" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18">HIDA 先用预定义模式递归融合，再检查临界任务是否因融合而变长。</text><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><rect x="70" y="244" width="330" height="172" rx="12" fill="#162235"/><text x="100" y="287" fill="#4DA3FF" font-size="23" font-weight="700">初始 tasks</text><circle cx="140" cy="350" r="30" fill="#4DA3FF"/><text x="126" y="357" fill="#0B1220" font-size="20">A</text><circle cx="230" cy="350" r="30" fill="#36D6B5"/><text x="216" y="357" fill="#0B1220" font-size="20">B</text><circle cx="320" cy="350" r="30" fill="#A78BFA"/><text x="306" y="357" fill="#0B1220" font-size="20">C</text><text x="100" y="398" fill="#AAB8CC" font-size="17">相邻、可匹配模式</text><path d="M420 330 H525" stroke="#4DA3FF" stroke-width="2"/><polygon points="530,330 519,324 519,336" fill="#4DA3FF"/><rect x="550" y="244" width="330" height="172" rx="12" fill="#162235" stroke="#36D6B5"/><text x="580" y="287" fill="#36D6B5" font-size="23" font-weight="700">模式驱动融合</text><text x="580" y="345" fill="#F4F7FB" font-size="20">elementwise epilogue</text><text x="580" y="383" fill="#AAB8CC" font-size="17">递归 worklist，直到无模式可匹配</text><path d="M900 330 H1005" stroke="#36D6B5" stroke-width="2"/><polygon points="1010,330 999,324 999,336" fill="#36D6B5"/><rect x="1030" y="244" width="190" height="172" rx="12" fill="#162235"/><text x="1060" y="287" fill="#FFB454" font-size="23" font-weight="700">再平衡</text><text x="1060" y="345" fill="#F4F7FB" font-size="19">比较关键任务</text><text x="1060" y="383" fill="#AAB8CC" font-size="17">过长则停止</text><rect x="70" y="483" width="1150" height="100" rx="12" fill="#162235"/><text x="100" y="526" fill="#F4F7FB" font-size="21">论文算法 2：反复找最不关键的相邻任务合并，直到融合使关键任务重新变差。</text><text x="100" y="562" fill="#AAB8CC" font-size="18">对 PyTorchSim 的类比：fusion knob 不能只看算子数量，还要看 TOG 中的 load/store 与同步代价。</text></g><text x="56" y="683" fill="#718096" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="12">来源：HIDA §6.2、Algorithm 2；类比部分为本研究建议。</text><text x="1160" y="683" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">11 / 24</text></svg>
