<g id="header" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><text x="56" y="64" fill="#A78BFA" font-size="14">HIDA 6 / 6 · 从算法读到实现</text><text x="56" y="115" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', 'Noto Serif CJK SC', serif" font-size="36" font-weight="700">HIDA 的可迁移部分，是表示、约束与分层求解的组合</text><text x="56" y="158" fill="#AAB8CC" font-size="18">先沿主 pipeline 读 pass，再看分析与变换；论文伪代码和公开实现需分别理解。</text></g>
<g id="paper" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><rect x="56" y="211" width="455" height="381" rx="12" fill="#162235"/><text x="85" y="258" fill="#A78BFA" font-size="24" font-weight="700">论文 Algorithm 4</text><text x="85" y="314" fill="#F4F7FB" font-size="20">提出一组 loop unroll factors</text><text x="85" y="358" fill="#F4F7FB" font-size="20">检查连接约束、并行度预算</text><text x="85" y="402" fill="#F4F7FB" font-size="20">合法点交给 QoR estimator</text><text x="85" y="446" fill="#F4F7FB" font-size="20">更新 DSE，收敛 / 早停后应用</text><line x1="85" y1="478" x2="480" y2="478" stroke="#2A3A52"/><text x="85" y="518" fill="#AAB8CC" font-size="18">候选先过约束，再花成本估计质量</text><text x="85" y="553" fill="#AAB8CC" font-size="18">局部最优仍受之前的划分决策影响</text></g>
<g id="code" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif"><rect x="547" y="211" width="677" height="381" rx="12" fill="#162235" stroke="#4DA3FF"/><text x="576" y="258" fill="#4DA3FF" font-size="24" font-weight="700">公开仓库：ScaleHLS-HIDA</text><text x="576" y="306" fill="#F4F7FB" font-family="Consolas, 'Courier New', monospace" font-size="19">lib/Transforms/Passes.cpp</text><text x="576" y="342" fill="#AAB8CC" font-size="18">hida-pytorch-pipeline 串起各优化阶段</text><text x="576" y="394" fill="#F4F7FB" font-family="Consolas, 'Courier New', monospace" font-size="18">LowerDataflow → EliminateMultiProducer</text><text x="576" y="432" fill="#F4F7FB" font-family="Consolas, 'Courier New', monospace" font-size="18">ScheduleDataflowNode → BalanceDataflowNode</text><text x="576" y="470" fill="#F4F7FB" font-family="Consolas, 'Courier New', monospace" font-size="18">ParallelizeDataflowNode → ArrayPartition</text><text x="576" y="523" fill="#AAB8CC" font-size="18">并行化 pass：复杂度预算 + 连接因子的置换 / 缩放</text><text x="576" y="559" fill="#FFB454" font-size="17">公开 pass 含直接因子分配，不能等同于完整 DSE 伪代码</text></g>
<text x="70" y="638" fill="#36D6B5" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="20">迁移时保留“机制”，用 PyTorchSim 的执行模型重新定义代价与合法性。</text>
