<text x="568" y="326" fill="#F4F7FB" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="26" font-weight="700">观察局部斜率</text>
<line x1="580" y1="460" x2="840" y2="460" stroke="#2A3A52" stroke-width="2"/><line x1="580" y1="360" x2="580" y2="460" stroke="#2A3A52" stroke-width="2"/>
<polyline points="590,440 650,414 715,420 782,374 835,330" fill="none" stroke="#36D6B5" stroke-width="4"/>
<circle cx="650" cy="414" r="6" fill="#36D6B5"/><circle cx="715" cy="420" r="6" fill="#36D6B5"/><circle cx="782" cy="374" r="6" fill="#36D6B5"/>
<text x="590" y="500" fill="#AAB8CC" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15">cycle / area / bandwidth response</text>
<path d="M930 388 L1040 388" stroke="#36D6B5" stroke-width="3"/><polygon points="1040,388 1024,379 1024,397" fill="#36D6B5"/>
