<text x="1082" y="326" fill="#F4F7FB" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="700">Prior</text>
<text x="1082" y="374" fill="#AAB8CC" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16"><tspan x="1082" dy="0">影响方向</tspan><tspan x="1082" dy="27">影响强度</tspan><tspan x="1082" dy="27">候选排序</tspan></text>
<rect x="60" y="590" width="1160" height="50" rx="10" fill="#1B2B40"/>
<text x="86" y="622" fill="#FFB454" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="700">关键学习：</text><text x="214" y="622" fill="#F4F7FB" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18">昂贵 simulator 只验证“最有信息量”的点，而不是每个点都同等对待。</text>
<text x="1168" y="672" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">05 / 16</text>
