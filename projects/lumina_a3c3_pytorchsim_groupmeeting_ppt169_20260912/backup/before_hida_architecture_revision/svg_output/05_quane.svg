<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#0B1220"/>
<text x="56" y="72" fill="#36D6B5" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2">02.2 · QUANTITATIVE ENGINE</text>
<text x="56" y="116" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', serif" font-size="38" font-weight="700">QuanE：用小实验把“可能相关”变成“影响强度”</text>
<text x="56" y="158" fill="#AAB8CC" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18">QualE 给出边界，QuanE 用局部 sensitivity 把下一步搜索初始化在更有希望的方向。</text>
<rect x="60" y="220" width="320" height="330" rx="14" fill="#162235" stroke="#2A3A52"/>
<text x="92" y="270" fill="#AAB8CC" font-family="Consolas, 'Courier New', monospace" font-size="15">microbenchmark</text>
<text x="92" y="332" fill="#F4F7FB" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="27" font-weight="700">只动一个旋钮</text>
<text x="92" y="380" fill="#4DA3FF" font-family="Consolas, 'Courier New', monospace" font-size="24">x₀ → x₀ + Δ</text>
<text x="92" y="430" fill="#AAB8CC" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16"><tspan x="92" dy="0">例如 core count ±1，</tspan><tspan x="92" dy="27">或者 memory channel +1。</tspan></text>
<path d="M408 388 L522 388" stroke="#4DA3FF" stroke-width="3"/><polygon points="522,388 506,379 506,397" fill="#4DA3FF"/>
<rect x="532" y="220" width="370" height="330" rx="14" fill="#162235" stroke="#2A3A52"/>
