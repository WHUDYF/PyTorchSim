<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#0B1220" />
<text x="56" y="72" fill="#A78BFA" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2">03.4 · MEDUSA</text>
<text x="56" y="116" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', serif" font-size="38" font-weight="700">Medusa：不是换芯片，而是重构算法的执行方式</text>
<text x="56" y="158" fill="#AAB8CC" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18">Medusa 直接针对 autoregressive decoding 的串行瓶颈，增加多个 heads 并行预测未来 token。</text>
<text x="80" y="250" fill="#F26D85" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="21" font-weight="700">传统 decoding</text>
<path fill="#162235" stroke="#F26D85" d="M94,280 H536 A14,14 0 0 1 550,294 V436 A14,14 0 0 1 536,450 H94 A14,14 0 0 1 80,436 V294 A14,14 0 0 1 94,280 Z" /><circle cx="150" cy="365" r="32" fill="#F26D85" fill-opacity="0.25" stroke="#F26D85" /><circle cx="310" cy="365" r="32" fill="#F26D85" fill-opacity="0.25" stroke="#F26D85" /><circle cx="470" cy="365" r="32" fill="#F26D85" fill-opacity="0.25" stroke="#F26D85" /><line x1="182" y1="365" x2="278" y2="365" stroke="#F26D85" stroke-width="3" /><line x1="342" y1="365" x2="438" y2="365" stroke="#F26D85" stroke-width="3" /><text x="150" y="373" text-anchor="middle" fill="#F4F7FB" font-family="Consolas, 'Courier New', monospace" font-size="16">t1</text><text x="310" y="373" text-anchor="middle" fill="#F4F7FB" font-family="Consolas, 'Courier New', monospace" font-size="16">t2</text><text x="470" y="373" text-anchor="middle" fill="#F4F7FB" font-family="Consolas, 'Courier New', monospace" font-size="16">t3</text><text x="150" y="420" text-anchor="middle" fill="#AAB8CC" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15">串行依赖</text><text x="310" y="420" text-anchor="middle" fill="#AAB8CC" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15">重复读权重</text><text x="470" y="420" text-anchor="middle" fill="#AAB8CC" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15">低利用率</text>
<text x="700" y="250" fill="#36D6B5" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="21" font-weight="700">Medusa decoding</text>
<path fill="#162235" stroke="#36D6B5" d="M714,280 H1156 A14,14 0 0 1 1170,294 V436 A14,14 0 0 1 1156,450 H714 A14,14 0 0 1 700,436 V294 A14,14 0 0 1 714,280 Z" /><circle cx="790" cy="365" r="32" fill="#36D6B5" fill-opacity="0.25" stroke="#36D6B5" /><text x="790" y="373" text-anchor="middle" fill="#F4F7FB" font-family="Consolas, 'Courier New', monospace" font-size="16">h</text><line x1="822" y1="365" x2="920" y2="315" stroke="#36D6B5" stroke-width="3" /><line x1="822" y1="365" x2="920" y2="365" stroke="#36D6B5" stroke-width="3" /><line x1="822" y1="365" x2="920" y2="415" stroke="#36D6B5" stroke-width="3" /><circle cx="952" cy="315" r="22" fill="#36D6B5" fill-opacity="0.25" stroke="#36D6B5" /><circle cx="952" cy="365" r="22" fill="#36D6B5" fill-opacity="0.25" stroke="#36D6B5" /><circle cx="952" cy="415" r="22" fill="#36D6B5" fill-opacity="0.25" stroke="#36D6B5" /><line x1="974" y1="315" x2="1090" y2="365" stroke="#4DA3FF" stroke-width="2" /><line x1="974" y1="365" x2="1090" y2="365" stroke="#4DA3FF" stroke-width="2" /><line x1="974" y1="415" x2="1090" y2="365" stroke="#4DA3FF" stroke-width="2" /><circle cx="1110" cy="365" r="28" fill="#4DA3FF" fill-opacity="0.25" stroke="#4DA3FF" /><text x="1110" y="372" text-anchor="middle" fill="#F4F7FB" font-family="Consolas, 'Courier New', monospace" font-size="15">verify</text>
<path fill="#1B2B40" d="M92,540 H1158 A12,12 0 0 1 1170,552 V598 A12,12 0 0 1 1158,610 H92 A12,12 0 0 1 80,598 V552 A12,12 0 0 1 92,540 Z" /><text x="106" y="582" fill="#A78BFA" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="700">给我们的启发：</text><text x="292" y="582" fill="#F4F7FB" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18">当瓶颈来自执行组织时，协同设计可以改变算法的执行图，而不只是改硬件旋钮。</text>
<text x="1168" y="672" fill="#718096" font-family="Consolas, 'Courier New', monospace" font-size="12">12 / 16</text>
</svg>