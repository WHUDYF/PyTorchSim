<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#0B1220" />
<text x="56" y="72" fill="#A78BFA" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2">03.2 · EDD</text>
<text x="56" y="116" fill="#F4F7FB" font-family="Georgia, 'Microsoft YaHei', serif" font-size="38" font-weight="700">EDD：把网络变量和实现变量联合连续化</text>
<text x="56" y="158" fill="#AAB8CC" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18">EDD 的贡献不是某个具体硬件参数，而是让 architecture 和 implementation 在同一个目标函数里被优化。</text>
<path fill="#162235" stroke="#A78BFA" stroke-width="2" d="M74,224 H386 A14,14 0 0 1 400,238 V540 A14,14 0 0 1 386,554 H74 A14,14 0 0 1 60,540 V238 A14,14 0 0 1 74,224 Z" />
<text x="92" y="272" fill="#A78BFA" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="700">Architecture space</text>
<text font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#F4F7FB" x="92" y="332">θ : op candidates</text><text font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#F4F7FB" x="92" y="370">kernel size</text><text font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#F4F7FB" x="92" y="408">channel expansion</text><path d="M412 389 L526 389" stroke="#A78BFA" stroke-width="3" /><polygon points="526,389 510,380 510,398" fill="#A78BFA" />
<path fill="#162235" stroke="#4DA3FF" stroke-width="2" d="M554,224 H866 A14,14 0 0 1 880,238 V540 A14,14 0 0 1 866,554 H554 A14,14 0 0 1 540,540 V238 A14,14 0 0 1 554,224 Z" />
<text x="572" y="272" fill="#4DA3FF" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="700">Implementation space</text>
<text font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#F4F7FB" x="572" y="332">φ : parallel factors</text><text font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#F4F7FB" x="572" y="370">loop tiling</text><text font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#F4F7FB" x="572" y="408">platform mapping</text><path d="M892 389 L1006 389" stroke="#4DA3FF" stroke-width="3" /><polygon points="1006,389 990,380 990,398" fill="#4DA3FF" />
<path fill="#162235" stroke="#36D6B5" stroke-width="2" d="M1034,224 H1206 A14,14 0 0 1 1220,238 V540 A14,14 0 0 1 1206,554 H1034 A14,14 0 0 1 1020,540 V238 A14,14 0 0 1 1034,224 Z" />
<text x="1050" y="272" fill="#36D6B5" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="700">Joint loss</text>
<text font-size="19" font-family="Consolas, 'Courier New', monospace" fill="#F4F7FB" x="1050" y="332">accuracy</text><text font-size="19" font-family="Consolas, 'Courier New', monospace" fill="#F4F7FB" x="1050" y="366">latency</text><text font-size="19" font-family="Consolas, 'Courier New', monospace" fill="#F4F7FB" x="1050" y="400">resource</text><path fill="#1B2B40" d="M70,594 H1210 A10,10 0 0 1 1220,604 V632 A10,10 0 0 1 1210,642 H70 A10,10 0 0 1 60,632 V604 A10,10 0 0 1 70,594 Z" /><text x="86" y="625" fill="#36D6B5" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="700">迁移到我们的 fixed-topology 路线：</text><text x="415" y="625" fill="#F4F7FB" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19">令 A=A₀，只保留 I × H，并用真实 TOGSim 结果校准 cost model。</text>
