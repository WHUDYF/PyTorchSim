<text x="86" y="622" fill="#FFB454" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="700">关键学习：</text><text x="214" y="622" fill="#F4F7FB" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18">昂贵 simulator 只验证“最有信息量”的点，而不是每个点都同等对待。</text>
